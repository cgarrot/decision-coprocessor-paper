# Runs Phase C principale (B3/B4) — SPEC §6.1/§8.3. Préparé par @ag-5, GO @ag-1 requis.
# Mêmes données, même tête initiale ({seed}), mêmes plafonds que R.
project: decision-coprocessor
spec_version: "1.0"
phase: controls_main

backbone:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  freeze: true
  precision: bf16
  attention_backend: sdpa
  use_cache: false
  max_length: 512

data:
  train: data/generated/train.jsonl
  dev: data/generated/dev.jsonl

decision:
  max_candidates: 16
  hidden_width: 256
  pooling: candidate_masked_mean
  dynamic_labels: true

init_from:
  fast_head_checkpoint: runs/p3_main/b2_s{seed}

training:
  seeds: [17, 29, 43]
  microbatch: 2
  effective_batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.05
  gradient_clip_norm: 1.0
  max_epochs: 3
  max_optimizer_steps: 1200
  eval_every_steps: 100
  eval_microbatch: 8
  checkpoint_selection: dev_macro_accuracy
  backbone_feature_cache: false

resources:
  one_gpu_job_only: true
  gpu_lock: runs/gpu.lock
  dataloader_workers: 0
  gpu_process_target_gib: 6.5
  gpu_safety_headroom_gib: 1.0
  host_process_tree_target_gib: 22.0
  cpu_offload: false
