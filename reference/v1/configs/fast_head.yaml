project: decision-coprocessor
spec_version: "1.0"
phase: fast_head            # Phase A — SPEC §8.1

backbone:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  freeze: true
  precision: bf16
  attention_backend: sdpa
  use_cache: false
  max_length: 512
  enable_thinking: false

data:
  train: data/generated/train.jsonl
  dev: data/generated/dev.jsonl
  test_iid: data/generated/test_iid.jsonl
  test_depth: data/generated/test_depth.jsonl
  test_composition: data/generated/test_composition.jsonl

decision:
  max_candidates: 16
  hidden_width: 256
  pooling: candidate_masked_mean
  dynamic_labels: true

training:
  variant: B2                # tête dynamique sur backbone gelé
  seeds: [17, 29, 43]
  microbatch: 2
  effective_batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_ratio: 0.05
  gradient_clip_norm: 1.0
  max_epochs: 3
  max_optimizer_steps: 1200
  eval_every_steps: 100
  checkpoint_selection: dev_macro_accuracy
  backbone_feature_cache: false

resources:
  one_gpu_job_only: true
  gpu_lock: runs/gpu.lock
  dataloader_workers: 2
  gpu_process_target_gib: 6.5
  gpu_safety_headroom_gib: 1.0
  host_process_tree_target_gib: 22.0
  cpu_offload: false
