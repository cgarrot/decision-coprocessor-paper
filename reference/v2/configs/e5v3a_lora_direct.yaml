# E5v3-A — étage LoRA (voie DIRECTE) — PRÉENREGISTRÉE avant tout run.
# MÊME adaptation LoRA que configs/e5v3a_lora_reader.yaml (équité F1 v1.7) :
# rang 16 / alpha 32 / dropout 0.05 / q,k,v,o toutes couches / lr 1e-4 /
# 1200 steps / micro 8 / accum 4 / seed 17 / warmup 5 % / clip 1.0.
# Budget identique à la voie lecteur ; sélection dev eval/100 (accuracy).
# Cache H INVALIDÉ (F2). Prompt complet (state+question+options, sans lettres).
project: decision-coprocessor-v2
stage: E5v3-A-direct
seed: 17

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  lr: 1.0e-4
  weight_decay: 0.01
  gradient_checkpointing: true

backbone:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  hf_cache: /home/cgarrot/zob/multi-step-jev/decision-coprocessor/hf_cache
  dtype: bfloat16
  max_length: 512
  readout_layers: [14, 21]
  readout_mode: mean

data:
  train: data/E5v2_train.jsonl
  dev: data/E5v2_dev.jsonl     # eval SCELLÉ

direct:                    # tête seule (identique E5v2-direct-L1421)
  d_model: 256
  hidden: 512
  head_lr: 3.0e-4           # politique deux groupes identique à la voie lecteur

training:
  optimizer: AdamW
  batch_size: 8
  accum: 4
  max_steps: 1200
  eval_every: 100
  warmup_ratio: 0.05
  clip: 1.0
  selection: accuracy_dev

abstention:                # F4 symétrie documentée : pas de graphe pour (d)
  policy: none_possible
  detail: "wrong_commit publié pour B4-4 (D2) ; le Δ primaire compare au (c)
           abstentionnel préenregistré côté pipeline."

outputs:
  run_dir: runs/e5v3a_direct
