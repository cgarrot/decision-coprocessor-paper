# E5v3-A — étage LoRA (voie LECTEUR) — PRÉENREGISTRÉE avant tout run.
# GO utilisateur via @ag-ask 06:32 ; règles v1.7 F1/F2 + v1.8 ; grille v1.6/G1.
# UNE SEULE adaptation LoRA, IDENTIQUE pour les deux voies (équité F1) :
#   pas de recherche de rang ; rang/modules/alpha/steps FIGÉS ci-dessous ;
#   cache H INVALIDÉ (F2) : forward adaptateur dans la boucle, aucune
#   réutilisation des caches gelés (h_e5_l1421m / h_direct_l1421m).
project: decision-coprocessor-v2
stage: E5v3-A-reader
seed: 17
hypothese: "L'adaptation du backbone lève le goulot d'extraction d'arêtes
  (edge 0.725, validité 0.62) que la lecture gelée n'a pas résolu ; le
  pipeline adapté doit franchir solve>=0.35 ET la grille v1.6 sur dev."

lora:                      # F2 : un seul couple, pas de variation
  rank: 16
  alpha: 32                # scaling 2.0
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]   # toutes les couches
  lr: 1.0e-4
  weight_decay: 0.01
  gradient_checkpointing: true

backbone:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  hf_cache: /home/cgarrot/zob/multi-step-jev/decision-coprocessor/hf_cache
  dtype: bfloat16
  max_length: 512
  readout_layers: [14, 21]     # reconduits (gel train-only v1.7ter)
  readout_mode: mean

data:
  train: data/E5v2_train.jsonl
  dev: data/E5v2_dev.jsonl     # eval SCELLÉ

extract:                   # recette it2/it3 inchangée (tête seule)
  deterministic_start: true
  hidden_size: 1024
  relation_mode: fact
  fact_weight: 1.0
  tag_weight: 1.0
  successor_weight: 1.0
  start_weight: 1.0
  head_lr: 3.0e-4           # groupe distinct, politique identique deux voies

training:
  optimizer: AdamW
  batch_size: 8
  accum: 4                  # effectif 32
  max_steps: 1200
  eval_every: 100
  warmup_ratio: 0.05
  clip: 1.0
  selection: edge_f1_stripped_dev

thresholds_dev:            # reconduits (QA v1.1) — définitions : docs/edge_f1_definition.md
  entity_f1_stripped_min: 0.85
  edge_f1_stripped_min: 0.65
  start_acc_min: 0.50
  solve_acc_min: 0.35

abstention:                # F4 : PRÉENREGISTRÉE cette fois (leçon it3 Q2)
  policy: rule_based_invalid_graph
  detail: "(c) répond si le graphe extrait est valide (validate_memory),
           s'abstient sinon — identique à la politique (b) ; PAS de seuil
           réglable. Le direct n'a pas de graphe : wrong_commit publié (D2).
           Δ primaire = all-in (abstentions=erreurs) sur CE (c) abstentionnel."
  mapping_archive: true     # nœud→option archivé dans les dumps d'interventions

outputs:
  run_dir: runs/e5v3a_reader

grille: v1.6 telle quelle (issues i/ii/iii + zone grise ; précédence
  mécanisme>Δ figée v1.8) sur dev ; E5v2_eval SCELLÉ ; si MISS → clôture
  définitive (T) automatique (mandat @ag-ask condition 3).
