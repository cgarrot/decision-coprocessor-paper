# V2.2 — A2 : supervision distributionnelle + propagation différentiable + INCONNU.
# Toutes les valeurs sont FIGÉES par V22_A2_ADDENDUM.md (co-signé @ag-3/@ag-1) :
# γ=1.0 · β=0 → [200,600) → 1.0 · α=1.0 · augmentation 25 %/1 fait+rappels/seed 17 ·
# recette LoRA deux-lr reconduite · init reader_lora_best.pt · T=20 ·
# sélection banc 2213 primaire c_prop puis b puis step min · scellés jamais utilisés.
# BASELINE = A1-bis (registre 2c47b06c, PASS, zéro entraînement) : c_prop ≈0.85
# invariant en profondeur. A2 doit battre A1-bis ET discret pour revendiquer ;
# enjeu = les ~10 pts restants vers le plafond (p)=0.95 + INCONNU (mondes partiels).
project: decision-coprocessor-v2
stage: V2.2-A2
seed: 17

backbone:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  hf_cache: /home/cgarrot/zob/multi-step-jev/decision-coprocessor/hf_cache
  dtype: bfloat16
  max_length: 512
  use_cache: false

data:
  train: data/E5v2_train.jsonl
  selection: data/v22/S-selection.jsonl      # SEULEMENT sélection (jamais les scellés)

init: artifacts/bundle_final_v2/reader_lora_best.pt

augmentation:                # addendum §4 — ENTRAÎNEMENT SEULEMENT
  rate: 0.25
  seed: 17

lora:                        # recette E5v3-A reconduite à l'identique
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  head_lr: 0.0003
  lora_lr: 0.0001

propagation:                 # addendum §1/§5
  steps: 20
  gamma: 1.0
  beta_start_step: 200
  beta_end_step: 600
  alpha_transition: 1.0
  unknown_weight: 1.0        # masse INCONNU : dérivée dans A (pas une classe CE)

training:
  micro: 8
  accum: 4
  steps: 1200
  eval_every: 100
  weight_decay: 0.01
  warmup: 0.05
  clip: 1.0

selection:                   # addendum §7
  primary: c_prop
  tiebreak: b_discret
  then: earliest_step

outputs:
  run_dir: runs/v22_a2
