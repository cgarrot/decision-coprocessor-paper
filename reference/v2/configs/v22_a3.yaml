# V2.2 — A3 : direct LoRA + têtes auxiliaires ÉGALES (spec V22_A3_SPEC.md, cf9fa53b).
# UNE SEULE variable vs le direct V2.1 : la supervision auxiliaire.
# Toutes les valeurs figées : recette Deux-lr E5v3-A, init direct_lora_best.pt,
# γ=1.0 · α=1.0 · β=0 → [200,600) → 1.0 · augmentation INCONNU 25 %/seed 17,
# CE réponse+états masquées sur items augmentés · sélection banc 2213 primaire
# accuracy réponse (tie-break NLL puis step) · scellés jamais utilisés.
project: decision-coprocessor-v2
stage: V2.2-A3
seed: 17

backbone:
  model_id: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  hf_cache: /home/cgarrot/zob/multi-step-jev/decision-coprocessor/hf_cache
  dtype: bfloat16
  max_length: 512
  use_cache: false

data:
  train: data/E5v2_train.jsonl
  selection: data/v22/S-selection.jsonl      # SEULEMENT sélection (jamais les scellés)

init: artifacts/bundle_final_v2/direct_lora_best.pt

augmentation:                # identique A2 : ENTRAÎNEMENT SEULEMENT
  rate: 0.25
  seed: 17

lora:                        # recette E5v3-A reconduite à l'identique
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  head_lr: 0.0003
  lora_lr: 0.0001

direct:
  d_model: 64
  hidden: 128

relations:                   # mêmes têtes/cibles que le lecteur A2
  d_model: 64
  hidden: 128

loss:                        # mêmes poids que A2 (spec §pertes)
  gamma: 1.0
  alpha: 1.0
  beta_start_step: 200
  beta_end_step: 600

training:
  micro: 8
  accum: 4
  steps: 1200
  eval_every: 100
  weight_decay: 0.01
  warmup: 0.05
  clip: 1.0

selection:                   # critère primaire DE LA VOIE (spec §sélection)
  primary: answer_accuracy
  tiebreak: nll_answer
  then: earliest_step

outputs:
  run_dir: runs/v22_a3
